name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-uart:
    name: Build UART FAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-uart
        with:
          app-dir: apps/uart
          sdk-channel: release

      - name: Upload UART FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipmesh_uart-fap
          path: ${{ steps.build-uart.outputs.fap-name }}
          retention-days: 30

  build-bt:
    name: Build BLE FAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with uFBT
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-bt
        with:
          app-dir: apps/bt
          sdk-channel: release

      - name: Upload BT FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipmesh_bt-fap
          path: ${{ steps.build-bt.outputs.fap-name }}
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SPDX headers
        run: |
          missing=0
          for f in core/*.c core/*.h apps/uart/*.c apps/uart/*.h apps/bt/*.c apps/bt/*.h; do
            [ -f "$f" ] || continue
            if ! grep -q "SPDX-License-Identifier" "$f"; then
              echo "Missing SPDX header: $f"
              missing=$((missing + 1))
            fi
          done
          exit $missing

      - name: Check for trailing whitespace
        run: |
          if grep -rn " $" --include="*.c" --include="*.h" core apps/uart apps/bt; then
            echo "Trailing whitespace found"
            exit 1
          fi
          echo "No trailing whitespace"
